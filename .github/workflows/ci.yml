name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ruff lint
        run: uv run --frozen ruff check --no-fix .
      - name: Ruff format
        run: uv run --frozen ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run tests
        # Speech-based tests need macOS `say` and are skipped on Linux.
        run: uv run --frozen pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          import ffmpeg_mcp, ffmpeg_mcp.main as m, os
          from ffmpeg_mcp.core.text_render import DEFAULT_FONT
          assert os.path.isfile(DEFAULT_FONT), DEFAULT_FONT
          print('ffmpeg-mcp-studio', ffmpeg_mcp.__version__, 'OK')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
